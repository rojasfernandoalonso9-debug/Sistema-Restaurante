spring:
  datasource:
    url: jdbc:h2:mem:restaurant-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
app:
  jwt:
    secret: test-signing-key-at-least-thirty-two-characters-long
    expiration-ms: 3600000
  cors:
    origin: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
