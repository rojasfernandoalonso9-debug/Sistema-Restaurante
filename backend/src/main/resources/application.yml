server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: restaurant-management
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/restaurante?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    origin: ${CORS_ORIGIN:http://localhost:5173}
